plugins { id 'com.android.application' }

def signing = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'ru.zovoceana.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'ru.zovoceana.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
